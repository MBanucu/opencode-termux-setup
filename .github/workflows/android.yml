name: android

# Builds the setup app, checks the F-Droid metadata, and proves the release build
# is reproducible.  The scaffold was written without an Android SDK, so this
# workflow is the compiler: it is what turns "probably builds" into an APK that
# can be installed on a device.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'fdroiddata/**'
      - 'docs/reproducible-builds.md'
      - 'test/**'
      - 'LICENSE'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: build debug apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The metadata test verifies that the tag in `Builds.commit` exists.  A
          # shallow checkout of a commit made after that tag contains no tags at
          # all, so the test failed on documentation-only pushes.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          manager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "sdk=$sdk" >>"$GITHUB_ENV"

      - name: F-Droid metadata test
        run: |
          pip install --quiet pyyaml
          bash test/fdroid-metadata-test.sh

      - name: Wrapper
        working-directory: android
        run: ./gradlew --version | sed -n '1,8p'

      # fdroiddata's source scanner rejects Maven hosts it does not recognise, so
      # the mirror that used to absorb Maven Central's 429s cannot be declared.
      # Retrying the build here is what covers that instead, and the failure is
      # printed in full rather than swallowed by a short tail.
      #
      # assembleDebugAndroidTest compiles the UI Automator end-to-end tests.  It
      # does not run them: that needs a device or emulator, which is what
      # test/android-e2e.sh does over adb.
      - name: Assemble
        working-directory: android
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/assemble.log"
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest 2>&1 | tee "$log"; then
              exit 0
            fi
            echo "::warning::assemble attempt $attempt failed"
            grep -E 'error:|429|Could not (resolve|find)|FAILURE|What went wrong' "$log" | head -15 || true
            [ "$attempt" -lt 3 ] || break
            sleep 20
          done
          echo "::error::assemble failed three times"
          exit 1

      - name: Report the apk
        working-directory: android
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk \
                     app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            ls -l "$apk"
            sha256sum "$apk"
          done
          "$sdk/build-tools/35.0.0/aapt2" dump badging \
            app/build/outputs/apk/debug/app-debug.apk 2>/dev/null |
            grep -E '^(package|sdkVersion|targetSdkVersion|application-label|uses-permission)' |
            head -10 || true

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-setup-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-setup-androidtest-apk
          path: android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      # Advisory while the app is young.
      - name: Lint (advisory)
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

  reproducible:
    name: reproducible release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          manager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "sdk=$sdk" >>"$GITHUB_ENV"

      # Two clean builds of the same commit must produce identical bytes.  The
      # unsigned release APK is compared because the debug APK carries a
      # per-machine debug signature.
      - name: Build twice and compare
        working-directory: android
        run: |
          set -euo pipefail
          build() {
            log="$RUNNER_TEMP/assemble-release-$2.log"
            for attempt in 1 2 3; do
              if ./gradlew --no-daemon --no-build-cache --rerun-tasks clean assembleRelease > "$log" 2>&1; then
                tail -3 "$log"
                break
              fi
              echo "::warning::assembleRelease attempt $attempt failed"
              grep -E 'error:|429|Could not (resolve|find)|FAILURE|What went wrong' "$log" | head -15 || true
              [ "$attempt" -lt 3 ] || { echo "::error::release build failed three times"; exit 1; }
              sleep 20
            done
            apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
            cp "$apk" "$1"
            sha256sum "$1"
          }
          build "$RUNNER_TEMP/first.apk" first
          build "$RUNNER_TEMP/second.apk" second
          if cmp "$RUNNER_TEMP/first.apk" "$RUNNER_TEMP/second.apk"; then
            echo "reproducible: both builds are byte-identical"
          else
            echo "::error::release build is not reproducible"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/first.apk"
