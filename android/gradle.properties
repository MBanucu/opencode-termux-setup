# Gradle and AGP settings for this repository.  Machine-specific paths do not
# belong here: local.properties is per checkout and ignored by git (see
# local.properties.example), and the aapt2 override is a property of the phone,
# normally set in ~/.gradle/gradle.properties or by tools/termux-build.sh.
org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true

# A second run of the same command skips configuration entirely.  CI keeps
# --no-daemon, so the cache is still built and reused within one job.
org.gradle.configuration-cache=true

# Reuse task outputs between clean builds.  docs/termux-build.md records the
# measured cold/warm times.
org.gradle.caching=true

# android.aapt2FromMavenOverride is required on Termux but AGP labels every use
# of it experimental.  The override is the documented workaround; suppress only
# that unsupported-option notice, not other AGP warnings.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Retry transient 429/5xx responses from Maven Central.  Gradle's default is 3
# tries with a short backoff, which is not enough when a shared CI egress IP gets
# rate-limited.  A mirror host would fix it faster, but fdroidserver's source
# scanner rejects Maven repositories it does not recognise, so retries are the
# only option that keeps `fdroid build` working.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
