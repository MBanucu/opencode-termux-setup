org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true

# Retry transient 429/5xx responses from Maven Central.  Gradle's default is 3
# tries with a short backoff, which is not enough when a shared CI egress IP gets
# rate-limited.  A mirror host would fix it faster, but fdroidserver's source
# scanner rejects Maven repositories it does not recognise, so retries are the
# only option that keeps `fdroid build` working.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
