org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true

# Retry transient 429/5xx responses from whichever Maven repository is used.
# Gradle's default is 3 tries with a very short backoff, which is not enough
# when a shared CI egress IP gets rate-limited.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
