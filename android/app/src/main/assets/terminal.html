<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="xterm/xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101418; overflow: hidden; }
  /* No inner margin: the frame around this is square now, so the grid can use
     every pixel it is given. */
  #screen { width: 100%; height: 100%; padding: 0; box-sizing: border-box; }
  .xterm .xterm-viewport { background: #101418 !important; }
  /* The viewport's own scrollbar would take a column's width from the grid -
     measured at twenty pixels on this phone - and paint a strip down the right
     edge of an otherwise full-width screen. Hidden, the grid uses the whole
     window and a touch drag still scrolls through the scrollback. */
  .xterm .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }
  /* Bundled so the box-drawing, block and ambiguous glyphs a TUI draws
     come from a font whose advance is the cell, not from a fallback. */
  @font-face {
    font-family: 'Terminal Mono';
    src: url('terminal-mono.ttf') format('truetype');
  }
</style>
</head>
<body>
<div id="screen"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script>
(function () {
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
  // A page that asked for a denser grid - a TUI needs one - carries the size in
  // its URL. It has to be known before the first fit: the PTY is sized to the
  // cells that fit, and a font set afterwards would leave the program drawing to
  // a width the terminal no longer has.
  var fontPx = parseInt((window.location.search.match(/[?&]font=(\d+)/) || [])[1], 10);
  // A page the intent wired a keyboard to: its keystrokes are sent back to the
  // PTY, which Termux runs with this page's socket as stdin.
  var inputOn = /[?&]input=1/.test(window.location.search);

  // The same dark scheme the app used before, so output looks the same.
  var term = new Terminal({
    theme: {
      background: '#101418', foreground: '#DCDCDC', cursor: '#DCDCDC',
      selectionBackground: '#3A3F4B',
      black: '#5C5C5C', red: '#E06C75', green: '#98C379', yellow: '#E5C07B',
      blue: '#61AFEF', magenta: '#C678DD', cyan: '#56B6C2', white: '#DCDCDC',
      brightBlack: '#7F7F7F', brightRed: '#E88B8B', brightGreen: '#B5E890',
      brightYellow: '#F0D197', brightBlue: '#82C7FF', brightMagenta: '#D79AE8',
      brightCyan: '#7FD6DF', brightWhite: '#FFFFFF'
    },
    fontFamily: "'Terminal Mono', monospace",
    fontSize: fontPx > 0 ? fontPx : 13,
    cursorBlink: true,
    // The default inactive cursor is an outline, so a page nobody has tapped
    // draws a hollow box around the character under the cursor - on the opencode
    // entry page that is the "A" of the composer's placeholder, which reads as a
    // broken glyph. A block is what Termux draws, focused or not.
    cursorInactiveStyle: 'block',
    // The bundle Termux returns uses "\n" where the PTY used "\r\n"; a real
    // terminal keeps the column on a line feed, which indented "exit code 0".
    convertEol: true,
    // Typing exists only where the page asked for it; a check's output has
    // nothing to type into.
    disableStdin: !inputOn,
    scrollback: 3000
  });

  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('screen'));
  // Fit subtracts the scrollbar width it measured when the viewport was made,
  // and falls back to fifteen when that measures zero. The bar is hidden above,
  // so tell it there is none and the last columns reach the edge of the page.
  if (term._core && term._core.viewport) {
    term._core.viewport.scrollBarWidth = 0;
  }

  // Without typing, focusing xterm's textarea raises a keyboard the command has
  // no use for, and the grid - which the PTY already has - would be refitted.
  // With typing, this textarea is the keyboard's landing place.
  if (term.textarea && !inputOn) {
    term.textarea.setAttribute('inputmode', 'none');
    term.textarea.setAttribute('readonly', 'readonly');
    term.textarea.style.pointerEvents = 'none';
  }

  /**
   * True once a command owns the grid.
   *
   * <p>The PTY was told this size, so the page must not quietly fit itself to a
   * smaller window: that would reflow the screen under a program still drawing
   * to the old grid. A frozen grid is re-fitted only together with a report,
   * which is how the PTY is told to take the same size. And the row that goes
   * first is the last one: a TUI's status line, where opencode prints its
   * version.
   */
  var frozen = false;

  /**
   * Guarantees the newest row ends inside the terminal area.
   *
   * <p>The fit addon derives the row count from a fractional cell height, and on
   * this device's pixel ratio the last row can still land a few pixels past the
   * bottom: measured, not guessed, as {"bottom":503,"limit":496}. When that
   * happens the terminal gives up one row, which was spare space anyway - better
   * a blank line fewer than a clipped one.
   */
  function keepTailVisible(refit) {
    // A frozen grid is the one the PTY has; dropping a row now would take a row
    // away from the program without telling it. A refit is the exception: the
    // app hands the new size to the PTY, so the program learns about the row.
    if (frozen && !refit) {
      return;
    }
    var area = document.getElementById('screen').getBoundingClientRect();
    var rows = document.querySelectorAll('.xterm-rows > div');
    var last = rows[rows.length - 1];
    if (!last) return;
    if (last.getBoundingClientRect().bottom - area.bottom > 0.5 && term.rows > 3) {
      term.resize(term.cols, term.rows - 1);
    }
  }

  /** Fits the grid to the area it is drawn in, newest row included. */
  function fitGrid() {
    try {
      fit.fit();
      // Fitting changes the row count, which can leave the newest line below
      // the last visible row.
      term.scrollToBottom();
      // A frozen grid is trimmed only as part of a re-fit: the report that
      // follows hands the row it lost to the PTY as well.
      keepTailVisible(frozen);
    } catch (e) { /* hidden or not laid out yet */ }
    alignFrozenGrid();
  }

  function fitNow() {
    if (frozen) {
      return;
    }
    fitGrid();
    reportResize();
  }
  fitNow();

  /**
   * The window, or the area it gives the page, moved.
   *
   * <p>Nothing tells the page the keyboard opened: it only sees the size change,
   * and the keyboard is one of the things that causes it. So every move is
   * treated the same way - the grid is fitted to what is visible now and
   * reported - and a frozen grid is re-fitted in this same step rather than
   * asking the app to ask for it again a round trip later. The report is what
   * the app hands to the PTY, so the program learns the new size and redraws.
   */
  function windowMoved() {
    fitGrid();
    reportResize();
  }
  window.addEventListener('resize', windowMoved);

  // Each keystroke goes back over the connection the output arrives on: the app
  // writes it to the socket Termux gave the pseudo terminal as stdin.
  if (inputOn) {
    term.onData(function (data) {
      if (!window.AndroidBridge) {
        return;
      }
      var utf8 = new TextEncoder().encode(data), binary = '', i;
      for (i = 0; i < utf8.length; i++) binary += String.fromCharCode(utf8[i]);
      window.AndroidBridge.onInput(window.btoa(binary));
    });
  }

  var waiting = false;

  function bytes(base64) {
    var binary = window.atob(base64);
    var out = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
    return out;
  }

  /** One chunk of the PTY's output, exactly as Termux wrote it. */
  window.writeB64 = function (base64) {
    if (waiting) { term.reset(); waiting = false; }
    // Follow the output only if the view was at the bottom already, so reading
    // back through a log is not yanked away. The callback runs once the chunk
    // has been parsed, when the buffer height is final - scrolling before that
    // is what left the last line hanging below the edge.
    var atBottom = term.buffer.active.viewportY >= term.buffer.active.baseY;
    term.write(bytes(base64), function () {
      if (atBottom) {
        term.scrollToBottom();
        keepTailVisible();
      }
    });
  };

  /** The placeholder shown between pressing a button and the first line. */
  window.waitingB64 = function (base64) {
    term.reset();
    waiting = true;
    term.write(bytes(base64));
  };

  window.resetTerm = function () { term.reset(); waiting = false; };

  /** Puts the cursor in the emulator's textarea, so typed keys have a target. */
  window.focusTerm = function () { if (inputOn) term.focus(); };
  /** Takes the cursor out again, so the keyboard can be dismissed for good. */
  window.blurTerm = function () { if (term.textarea) term.textarea.blur(); };

  /** Stops refitting: the running command owns this grid until it exits. */
  window.lockFit = function () { frozen = true; alignFrozenGrid(); reportResize(); };

  /** Lets a reused page measure itself again for a new intent. */
  window.thawFit = function () { frozen = false; fitNow(); reportResize(); };
  window.fitNow = fitNow;

  /** The last size the app was told, so a window that has not moved sends none. */
  var lastResize = '';

  /**
   * Announces the grid and the window it sits in, as soon as either moves.
   *
   * <p>Until now the size only reached the app folded into the screen report,
   * which is published four times a second at best and not at all while the
   * screen is still. A resize is an event, not a state to poll: the keyboard
   * opening, a rotation and the window regaining height all change what the next
   * command should be sized to, and {@code frozen} says these numbers are the
   * grid a running command owns; the app hands any change to the PTY, which a
   * program on the other side sees as a resize.
   */
  function reportResize() {
    if (!window.AndroidBridge) {
      return;
    }
    var area = document.getElementById('screen').getBoundingClientRect();
    var state = JSON.stringify({
      cols: term.cols,
      rows: term.rows,
      width: Math.round(area.width),
      height: Math.round(area.height),
      frozen: frozen
    });
    if (state === lastResize) {
      return;
    }
    lastResize = state;
    window.AndroidBridge.onResize(state);
  }

  /**
   * Holds a frozen grid's bottom against the bottom of the area it is drawn in.
   *
   * <p>The grid is the one the PTY was given, so a window that just got shorter
   * cannot shrink it. Left alone the terminal clips its newest rows, which in a
   * TUI are the composer and the status line being typed into; shifted up it
   * clips the oldest instead, the way a terminal with a resizable PTY keeps the
   * cursor in view.
   */
  function alignFrozenGrid() {
    var area = document.getElementById('screen').getBoundingClientRect();
    var rows = document.querySelector('.xterm-rows');
    var box = document.querySelector('.xterm');
    if (!rows || !box) {
      return;
    }
    var hidden = rows.getBoundingClientRect().height - area.height;
    box.style.transform = hidden > 1 ? 'translateY(-' + Math.round(hidden) + 'px)' : '';
  }

  // The window's own resize event is not enough: the element can be given a new
  // size - the keyboard shortening the page - without the browser's window
  // changing at all.
  if (window.ResizeObserver) {
    new ResizeObserver(windowMoved).observe(document.getElementById('screen'));
  }
  reportResize();

  /** The whole scrollback as plain text, so the page's node can report it. */
  function screenText() {
    var buffer = term.buffer.active, lines = [], i, line;
    for (i = 0; i < buffer.length; i++) {
      line = buffer.getLine(i);
      lines.push(line ? line.translateToString(true) : '');
    }
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    // The whole visible screen, not an arbitrary slice of the scrollback: an
    // install's whole history is too much for an accessibility node, but a
    // full-screen program draws its newest output at the top as often as at the
    // bottom - opencode's shell result sits on the first rows - and a slice of
    // the last forty lines then publishes a screen in which nothing changed.
    return lines.slice(-Math.max(40, term.rows)).join('\n');
  }

  /**
   * Where the last written line ends, in CSS pixels, against the bottom of the
   * terminal area.
   *
   * <p>This is what "the last line is fully visible" means where it can be
   * measured: the row's bottom edge must not be past the area's, so it cannot be
   * clipped at the bottom edge. A test asserts it at several terminal heights
   * instead of trusting a screenshot.
   */
  function tailInfo() {
    var area = document.getElementById('screen').getBoundingClientRect();
    var rows = document.querySelectorAll('.xterm-rows > div');
    for (var i = rows.length - 1; i >= 0; i--) {
      var text = rows[i].textContent || '';
      if (text.trim() === '') {
        continue;
      }
      var box = rows[i].getBoundingClientRect();
      return {
        terminal: Math.round(area.height),
        // The PTY is resized to this, so a redrawn progress line fits.
        cols: term.cols,
        rows: term.rows,
        row: Math.round(box.height),
        bottom: Math.round(box.bottom),
        limit: Math.round(area.bottom),
        fits: box.bottom <= area.bottom + 1,
        chars: text.length
      };
    }
    return { terminal: Math.round(area.height), cols: term.cols, rows: term.rows,
             row: 0, bottom: 0, limit: Math.round(area.bottom), fits: false, chars: 0 };
  }

  // Published once a second, not per chunk: every update is an accessibility
  // event, and a terminal that fires four a second keeps UI Automator from
  // getting a stable snapshot of the page.
  var last = '';
  var lastSize = '';

  /** Publishes the screen and the size the PTY has to match, when either moved. */
  function publish() {
    // Before the first fit the emulator reports a couple of cells, and a command
    // sent at that width is worse than one sent at the PTY's default.
    var laidOut = term.cols >= 20 && term.rows >= 5;
    var size = term.cols + 'x' + term.rows;
    var text = screenText();
    var sizeChanged = laidOut && size !== lastSize;
    if (!window.AndroidBridge || (text === last && !sizeChanged)) {
      return;
    }
    last = text;
    if (laidOut) {
      lastSize = size;
    }
    window.AndroidBridge.onScreen(text);
    window.AndroidBridge.onTail(JSON.stringify(tailInfo()));
  }

  // Four times a second, not per chunk: every update is an accessibility event,
  // and a terminal that fires per chunk keeps UI Automator from getting a stable
  // snapshot of the page. Once a second, though, meant every wait paid up to a
  // second for a screen that had already been drawn.
  setInterval(publish, 250);

  // ...and once as soon as the page is laid out: the command waits for this size
  // before it is handed to Termux, so every second before it is a second the
  // user waits on an empty terminal.
  fitNow();
  publish();
  }

  // xterm measures its cell when the terminal opens. A font that arrives
  // after that leaves the grid sized from whatever fallback was loaded, which
  // is how the box-drawing rows ended up a fraction of a cell off.
  // Never wait on the font: a missing or blocked file would leave the page
  // blank, and whichever call runs first wins the guard above.
  setTimeout(boot, 1500);
  if (document.fonts && document.fonts.load) {
    document.fonts.load("8px 'Terminal Mono'").then(boot, boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
