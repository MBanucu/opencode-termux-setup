<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="xterm/xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101418; overflow: hidden; }
  /* Extra room at the bottom: the frame is rounded and clipped, so a row sitting
     flush against the edge reads as cut off. */
  #screen { width: 100%; height: 100%; padding: 8px 8px 22px; box-sizing: border-box; }
  .xterm .xterm-viewport { background: #101418 !important; }
</style>
</head>
<body>
<div id="screen"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script>
(function () {
  // The same dark scheme the app used before, so output looks the same.
  var term = new Terminal({
    theme: {
      background: '#101418', foreground: '#DCDCDC', cursor: '#DCDCDC',
      selectionBackground: '#3A3F4B',
      black: '#5C5C5C', red: '#E06C75', green: '#98C379', yellow: '#E5C07B',
      blue: '#61AFEF', magenta: '#C678DD', cyan: '#56B6C2', white: '#DCDCDC',
      brightBlack: '#7F7F7F', brightRed: '#E88B8B', brightGreen: '#B5E890',
      brightYellow: '#F0D197', brightBlue: '#82C7FF', brightMagenta: '#D79AE8',
      brightCyan: '#7FD6DF', brightWhite: '#FFFFFF'
    },
    fontFamily: 'monospace',
    fontSize: 13,
    cursorBlink: true,
    // The bundle Termux returns uses "\n" where the PTY used "\r\n"; a real
    // terminal keeps the column on a line feed, which indented "exit code 0".
    convertEol: true,
    // Display only: nothing is typed here, the command runs in Termux.
    disableStdin: true,
    scrollback: 3000
  });

  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('screen'));

  /**
   * Guarantees the newest row ends inside the terminal area.
   *
   * <p>The fit addon derives the row count from a fractional cell height, and on
   * this device's pixel ratio the last row can still land a few pixels past the
   * bottom: measured, not guessed, as {"bottom":503,"limit":496}. When that
   * happens the terminal gives up one row, which was spare space anyway - better
   * a blank line fewer than a clipped one.
   */
  function keepTailVisible() {
    var area = document.getElementById('screen').getBoundingClientRect();
    var rows = document.querySelectorAll('.xterm-rows > div');
    var last = rows[rows.length - 1];
    if (!last) return;
    if (last.getBoundingClientRect().bottom - area.bottom > 0.5 && term.rows > 3) {
      term.resize(term.cols, term.rows - 1);
    }
  }

  function fitNow() {
    try {
      fit.fit();
      // Fitting changes the row count, which can leave the newest line below
      // the last visible row.
      term.scrollToBottom();
      keepTailVisible();
    } catch (e) { /* hidden or not laid out yet */ }
  }
  fitNow();
  window.addEventListener('resize', fitNow);

  var waiting = false;

  function bytes(base64) {
    var binary = window.atob(base64);
    var out = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
    return out;
  }

  /** One chunk of the PTY's output, exactly as Termux wrote it. */
  window.writeB64 = function (base64) {
    if (waiting) { term.reset(); waiting = false; }
    // Follow the output only if the view was at the bottom already, so reading
    // back through a log is not yanked away. The callback runs once the chunk
    // has been parsed, when the buffer height is final - scrolling before that
    // is what left the last line hanging below the edge.
    var atBottom = term.buffer.active.viewportY >= term.buffer.active.baseY;
    term.write(bytes(base64), function () {
      if (atBottom) {
        term.scrollToBottom();
        keepTailVisible();
      }
    });
  };

  /** The placeholder shown between pressing a button and the first line. */
  window.waitingB64 = function (base64) {
    term.reset();
    waiting = true;
    term.write(bytes(base64));
  };

  window.resetTerm = function () { term.reset(); waiting = false; };
  window.fitNow = fitNow;

  /** The whole scrollback as plain text, so the page's node can report it. */
  function screenText() {
    var buffer = term.buffer.active, lines = [], i, line;
    for (i = 0; i < buffer.length; i++) {
      line = buffer.getLine(i);
      lines.push(line ? line.translateToString(true) : '');
    }
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    // An accessibility node does not carry an install's whole scrollback well:
    // the last lines are what a reader and the end-to-end test need, and a
    // check result is two of them.
    return lines.slice(-40).join('\n');
  }

  /**
   * Where the last written line ends, in CSS pixels, against the bottom of the
   * terminal area.
   *
   * <p>This is what "the last line is fully visible" means where it can be
   * measured: the row's bottom edge must not be past the area's, so it cannot be
   * clipped by the rounded frame. A test asserts it at several terminal heights
   * instead of trusting a screenshot.
   */
  function tailInfo() {
    var area = document.getElementById('screen').getBoundingClientRect();
    var rows = document.querySelectorAll('.xterm-rows > div');
    for (var i = rows.length - 1; i >= 0; i--) {
      var text = rows[i].textContent || '';
      if (text.trim() === '') {
        continue;
      }
      var box = rows[i].getBoundingClientRect();
      return {
        terminal: Math.round(area.height),
        // The PTY is resized to this, so a redrawn progress line fits.
        cols: term.cols,
        rows: term.rows,
        row: Math.round(box.height),
        bottom: Math.round(box.bottom),
        limit: Math.round(area.bottom),
        fits: box.bottom <= area.bottom + 1,
        chars: text.length
      };
    }
    return { terminal: Math.round(area.height), cols: term.cols, rows: term.rows,
             row: 0, bottom: 0, limit: Math.round(area.bottom), fits: false, chars: 0 };
  }

  // Published once a second, not per chunk: every update is an accessibility
  // event, and a terminal that fires four a second keeps UI Automator from
  // getting a stable snapshot of the page.
  var last = '';
  var lastSize = '';

  /** Publishes the screen and the size the PTY has to match, when either moved. */
  function publish() {
    // Before the first fit the emulator reports a couple of cells, and a command
    // sent at that width is worse than one sent at the PTY's default.
    var laidOut = term.cols >= 20 && term.rows >= 5;
    var size = term.cols + 'x' + term.rows;
    var text = screenText();
    var sizeChanged = laidOut && size !== lastSize;
    if (!window.AndroidBridge || (text === last && !sizeChanged)) {
      return;
    }
    last = text;
    if (laidOut) {
      lastSize = size;
    }
    window.AndroidBridge.onScreen(text);
    window.AndroidBridge.onTail(JSON.stringify(tailInfo()));
  }

  // Four times a second, not per chunk: every update is an accessibility event,
  // and a terminal that fires per chunk keeps UI Automator from getting a stable
  // snapshot of the page. Once a second, though, meant every wait paid up to a
  // second for a screen that had already been drawn.
  setInterval(publish, 250);

  // ...and once as soon as the page is laid out: the command waits for this size
  // before it is handed to Termux, so every second before it is a second the
  // user waits on an empty terminal.
  fitNow();
  publish();
})();
</script>
</body>
</html>
