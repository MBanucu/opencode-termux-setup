Builds:
  # fdroiddata asks for only the version being submitted and for a full commit
  # hash rather than a tag.  This commit carries this metadata and the phone
  # screenshots; the app code in it is the 0.2.0 release, tagged android-v0.2.0.
  - versionName: 0.2.0
    versionCode: 2
    commit: 6a655fa0a6cf668d8372f32f77b240bf9c3deeb3
    subdir: android
    gradle:
      - yes
    output: app/build/outputs/apk/release/*.apk

MaintainerNotes: |-
  Version checks are manual (`UpdateCheckMode: None`) on purpose: this repository
  also tags the installer and releases APKs, so an automatic tag check would read
  unrelated tags as new app versions. Bump `Builds`, `CurrentVersion` and
  `CurrentVersionCode` together with a new `android-v*` tag.

  The app declares no INTERNET permission; the download the consent dialog
  describes is performed by Termux, not by this app. If a reviewer reads the
  permission list, that is why.

  Reproducibility: the release build disables AGP's dependency metadata blob and
  BuildConfig generation, which are the two inputs that vary without a source
  change. `docs/reproducible-builds.md` records how it is checked, and the
  `reproducible` CI job builds `assembleRelease` twice and compares the bytes.
  `versionCode`/`versionName` live only in `android/app/build.gradle.kts` and must
  match the `Builds` entry.

