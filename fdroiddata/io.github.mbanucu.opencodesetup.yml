AutoName: opencode-setup
Description: |-
  opencode is a coding agent for the terminal. Upstream publishes only glibc and
  musl builds, so on Android the official installer and the npm package both
  fail: Termux runs on Bionic, and there is no glibc loader on the device.

  This app is the setup companion for the native Android build of opencode. It
  contains no opencode and installs nothing by itself. It checks that Termux is
  installed, shows exactly which repository will be added and how much will be
  downloaded, and then, with your consent, hands one command to Termux that adds
  the signed APT repository and installs the package. It can later report the
  installed version, and it explains how to fix the one Termux setting that
  blocks commands from other apps.

  The package comes from bd-loser/opencode-bionic, a third-party project that
  cross-compiles opencode for Android and publishes it on GitHub Pages. It is not
  an official opencode release, and this app says so before you agree to it.

  Requirements: Termux from F-Droid or GitHub (not Google Play), Android 7.0 or
  newer, about 210 MB of free space, and a connection for the first install.

  The app requests no INTERNET permission, has no analytics, no accounts and no
  background work. It talks to Termux, and only when you press a button.

  The installer, documentation and issue notes are at
  https://github.com/MBanucu/opencode-termux-setup (GPL-3.0-or-later). opencode itself is MIT
  and is not redistributed here.

RepoType: git
